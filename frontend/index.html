<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1; url=http://127.0.0.1:8000">
    <title>LUXORIA | Serveur Frontend</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <style>
        body {
            background-color: #0A0A0B;
            color: #F3E5AB;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(18, 18, 20, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 40px;
            max-width: 520px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.1);
        }
        h1 {
            color: #D4AF37;
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        p {
            color: #D1D5DB;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #C5A059 100%);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 9999px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        code {
            background: rgba(255, 255, 255, 0.1);
            color: #D4AF37;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>LUXORIA</h1>
        <p><strong>Serveur Frontend Vite actif !</strong></p>
        <p>L'application s'exécute sur le serveur Laravel. Vous allez être redirigé automatiquement vers l'application.</p>
        <p style="font-size: 13px; color: #9CA3AF;">Si la redirection ne se fait pas, assurez-vous que <code>php artisan serve</code> tourne dans le dossier <code>backend</code>.</p>
        <a href="http://127.0.0.1:8000" class="btn">Ouvrir l'application (http://127.0.0.1:8000)</a>
    </div>
</body>
</html>
